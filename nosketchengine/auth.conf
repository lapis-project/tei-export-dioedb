# Protect the whole UI and API. Only the static health probe is public.
server.modules += ( "mod_authn_file" )
auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/etc/lighttpd/noske.htpasswd"

$HTTP["url"] != "/healthz" {
    auth.require = ( "/" => (
        "method" => "basic",
        "realm" => "DiÖ corpus",
        "require" => "valid-user"
    ) )
}
