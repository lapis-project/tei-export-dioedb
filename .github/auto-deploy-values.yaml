# The shared deploy workflow substitutes these variables before invoking Helm.
replicaCount: 1
image:
  repository: $repository
  tag: "$tag"
  pullPolicy: Always
  secrets: []
extraLabels:
  ID: "$service_id"
gitlab:
  app: "$app_name"
  envURL: "$repo_url"
service:
  enabled: true
  name: web
  url: "$public_url"
  additionalHosts:
    - ${app_name_in_url}-${ref_name}.${kube_ingress_base_domain}
  type: ClusterIP
  externalPort: 8080
  internalPort: 8080
ingress:
  enabled: true
  path: /
  annotations:
    kubernetes.io/ingressClassName: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
livenessProbe:
  path: /healthz
  initialDelaySeconds: 15
  timeoutSeconds: 15
  scheme: HTTP
  probeType: httpGet
readinessProbe:
  path: /healthz
  initialDelaySeconds: 5
  timeoutSeconds: 3
  scheme: HTTP
  probeType: httpGet
