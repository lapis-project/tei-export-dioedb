name: Deploy dioedbcorpus NoSke Engine to Cluster
on:
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
jobs:
  generate_workflow_vars:
    runs-on: ubuntu-latest
    steps:
      - name: Generate PUBLIC_URL if not set
        id: generate_public_url
        run: >
          kube_ingress_base_domain="${{ vars.KUBE_INGRESS_BASE_DOMAIN }}"

          public_url="${{ vars.PUBLIC_URL }}"

          if [ "${public_url}x" == 'x' ]

          then public_url=https://corpus-noske.${kube_ingress_base_domain}

          fi

          echo "public_url=$public_url" >> $GITHUB_OUTPUT
      - name: Generate environment name
        id: generate_env_name
        run: echo "environment=production" >> $GITHUB_OUTPUT
    outputs:
      PUBLIC_URL: '${{ steps.generate_public_url.outputs.public_url }}'
      ENV_NAME: '${{ steps.generate_env_name.outputs.environment }}'
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate Verticals from DB
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          cd scripts
          # Generate all Transcripts
          python3 process-all-transcripts.py ./cache ./tei-files

          mkdir -p ./verticals

          # Generate Verticals
          python3 generate-vertical.py ./tei-files ./standoff/standoff_informants.xml ./verticals

      - name: Prepare Build Context
        run: |
          mv scripts/verticals/*.vert verticals/ || echo "No verticals found to move"
          mv scripts/tei-files/*.xml tei/ || echo "No TEI found to move"

      - name: Commit auto generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tei/*.xml
          git add verticals/*.vert
          git commit -m "Automatic generated TEI files" -a

      - name: Push changes back to GitHub
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: login to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create tags based on git data
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}-corpus-data
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{sha}}
      - name: build and push to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nosketchengine/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
  _3:
    needs: [build, generate_workflow_vars]
    uses: lapis-project/gl-autodevops-minimal-port/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      DOCKER_TAG: ghcr.io/${{ github.repository }}-corpus-data
      APP_NAME: 'corpus-noske'
      APP_ROOT: '/'
      POSTGRES_ENABLED: false
      PUBLIC_URL: '${{ needs.generate_workflow_vars.outputs.PUBLIC_URL }}'
      environment: '${{ needs.generate_workflow_vars.outputs.ENV_NAME }}'
      default_port: '8080'
